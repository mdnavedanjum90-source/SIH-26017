<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BhoomiDrishti</title>
    <!-- Your CSS styles -->
</head>
<body>

    <!-- Your website UI elements / dashboard layout go here -->
    <div id="app">
      <h1>Welcome to BhoomiDrishti</h1>
    </div>

    <!-- Paste the script right here -->
    <script>
      async function fetchBhoomiData() {
        try {
          const response = await fetch('/api/data'); // Points to your backend via Vercel rewrites
          const data = await response.json();
          console.log("Loaded live backend data:", data);
          
          // Optional: Display the data on your website instead of just the console
          // document.getElementById('app').innerHTML += `<p>${JSON.stringify(data)}</p>`;
        } catch (error) {
          console.error("Error connecting to backend:", error);
        }
      }
      
      // Run the function when the page loads
      fetchBhoomiData();
    </script>
</body>
</html>
